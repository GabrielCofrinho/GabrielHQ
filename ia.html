<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GabrielHQ - IA da História</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    
    <style>
        .header-top h1 { color: #4F4866; font-family: 'Caveat', cursive; }
        .container-ia { max-width: 800px; margin: 20px auto; padding: 20px; text-align: center; }
        .status-badge { font-family: 'Caveat', cursive; font-size: 1.3rem; padding: 6px 14px; border-radius: 8px; background: #DECADE; color: #4F4866; display: inline-block; margin-bottom: 15px; font-weight: bold; border: 2px solid #4F4866; }
        .aviso-ia { font-style: italic; font-size: 1.1rem; color: #666; margin-bottom: 15px; }

        .chat-box {
            background: #ffffff;
            border: 3px solid #4F4866;
            border-radius: 20px;
            box-shadow: 4px 4px 0px #DECADE;
            padding: 20px;
            max-width: 750px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-feed {
            max-height: 420px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 10px;
            text-align: left;
        }

        .msg-row { display: flex; width: 100%; }
        .msg-row.user { justify-content: flex-end; }
        .msg-row.ia { justify-content: flex-start; }

        .balloon {
            font-family: 'Caveat', cursive;
            font-size: 1.35rem;
            line-height: 1.4;
            padding: 12px 18px;
            position: relative;
            max-width: 80%;
            box-shadow: 2px 2px 0px rgba(79, 72, 102, 0.15);
        }

        .balloon-user {
            background: #4F4866;
            color: #ffffff;
            border-radius: 18px 18px 2px 18px;
            border: 2px solid #4F4866;
        }
        .balloon-user::after {
            content: "";
            position: absolute;
            top: 0;
            right: -10px;
            width: 0;
            height: 0;
            border-top: 10px solid #4F4866;
            border-right: 10px solid transparent;
        }

        .balloon-ia {
            background: #DECADE;
            color: #4F4866;
            border-radius: 18px 18px 18px 2px;
            border: 2px solid #4F4866;
        }
        .balloon-ia::before {
            content: "";
            position: absolute;
            top: 0;
            left: -10px;
            width: 0;
            height: 0;
            border-top: 10px solid #DECADE;
            border-left: 10px solid transparent;
        }

        .balloon-thought {
            background: #ffffff;
            color: #4F4866;
            border: 2px dashed #4F4866;
            border-radius: 18px;
            font-size: 1.15rem;
            max-width: 85%;
        }

        .box-pesquisa { display: flex; gap: 12px; justify-content: center; align-items: center; margin-top: 10px; }
        .input-ia { width: 75%; padding: 10px 18px; border: 3px solid #4F4866; border-radius: 25px; font-family: 'Caveat', cursive; font-size: 1.4rem; color: #4F4866; background: #ffffff; outline: none; }
        .btn-analisar { background: #4F4866; color: white; border: none; border-radius: 12px; padding: 10px 22px; font-size: 1.3rem; font-weight: bold; cursor: pointer; font-family: 'Caveat', cursive; }
        .btn-analisar:hover { background: #3d3752; }
    </style>
</head>
<body>

    <div id="home">
        <header class="header-top">
            <h1 class="logo">Quer saber mais sobre os personagens?</h1>
        </header>

        <main class="container-ia">
            <div id="statusScript" class="status-badge">Carregando informações...</div>
            <p class="aviso-ia">(Aviso: Essa IA não é generativa e pode cometer erros se a pergunta for complicada)</p>

            <div class="chat-box">
                <div id="chatFeed" class="chat-feed">
                    <div class="msg-row ia">
                        <div class="balloon balloon-ia">
                            Olá! Digite sua pergunta sobre os personagens ou histórias abaixo... 💭
                        </div>
                    </div>
                </div>

                <div class="box-pesquisa">
                    <input type="text" id="pergunta" class="input-ia" placeholder="Digite sua pergunta..." onkeydown="tratarTeclaEnter(event)">
                    <button class="btn-analisar" id="btnEnviar" onclick="processarPergunta()">Enviar</button>
                </div>
            </div>
        </main>
    </div>

    <script src="dicionário.js"></script>
    <script src="informações.js"></script>
    <script src="sons.js"></script>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let ultimoPersonagemCitado = null; // Memória de contexto simples

        function iniciarAudioContext() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        function tocarSintetizador8Bit(freq = 440, duracao = 0.03) {
            iniciarAudioContext();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duracao);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duracao);
        }

        function tocarSomLetra(prefixo, tom8bit = 440) {
            let listaArquivos = [];

            if (prefixo.startsWith("IAfala") && typeof SONS_IA !== 'undefined') {
                listaArquivos = SONS_IA;
            } else if (prefixo.startsWith("USERfala") && typeof SONS_USER !== 'undefined') {
                listaArquivos = SONS_USER;
            }

            if (listaArquivos.length > 0) {
                const indiceSorteado = Math.floor(Math.random() * listaArquivos.length);
                const audio = new Audio(listaArquivos[indiceSorteado]);
                audio.volume = 0.5;
                audio.play().catch(() => {
                    tocarSintetizador8Bit(tom8bit, 0.03);
                });
            } else {
                tocarSintetizador8Bit(tom8bit, 0.03);
            }
        }

        // Função utilitária para sortear frases e evitar respostas repetitivas
        function sortearResposta(opcoes) {
            let idx = Math.floor(Math.random() * opcoes.length);
            return opcoes[idx];
        }

        const PALAVRAS_IGNORADAS = [
            "de", "do", "da", "dos", "das", "em", "no", "na", "nos", "nas", "para", "por", "com", 
            "seu", "sua", "seus", "suas", "você", "voce", "o", "a", "os", "as", "um", "uma", "uns", "umas",
            "ja", "tambem", "que", "se", "porq", "porque", "qual", "quais", "historia", "historias",
            "hq", "hqs", "quadrinho", "quadrinhos", "ep", "episodio", "episodios", "idade", "anos", "funcao",
            "moradia", "nome", "especie", "oi", "ola", "eai", "opa", "bom", "dia", "tarde", "noite", "ele", "ela"
        ];

        function obterBanco() {
            return (typeof BANCO_PERSONAGENS !== 'undefined' && Array.isArray(BANCO_PERSONAGENS)) ? BANCO_PERSONAGENS : [];
        }

        function verificarECarregarBanco() {
            let total = obterBanco().length;
            let statusDic = (typeof dicionario !== 'undefined') ? " | 📖 Dicionário Conectado" : " | ⚠️ Dicionário Ausente";
            let totalHist = (typeof HISTORIAS !== 'undefined') ? Object.keys(HISTORIAS).length : 0;
            let statusHist = totalHist > 0 ? ` | 📜 ${totalHist} Histórias Carregadas` : " | ⚠️ Sem Histórias";
            document.getElementById("statusScript").innerText = `✅ Informações carregadas (${total} personagens${statusDic}${statusHist})`;
        }
        document.addEventListener('DOMContentLoaded', verificarECarregarBanco);

        function tratarTeclaEnter(e) { if (e.key === "Enter") processarPergunta(); }
        
        function removerAcentos(str) { 
            if (!str) return '';
            return String(str).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w\s-]/gi, ''); 
        }

        function extrairRadical(palavra) {
            let p = removerAcentos(palavra);
            if (p.length <= 4) return p;
            return p.replace(/(ou|ando|endo|indo|ar|er|ir|am|em|ara|era|ira|as|es|is)$/i, '');
        }

        function escapeRegExp(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
        function aguardar(ms) { return new Promise(r => setTimeout(r, ms)); }

        function formatarListaNatural(listaNomes) {
            if (!listaNomes || listaNomes.length === 0) return "";
            if (listaNomes.length === 1) return listaNomes[0];
            if (listaNomes.length === 2) return `${listaNomes[0]} e ${listaNomes[1]}`;
            return `${listaNomes.slice(0, -1).join(", ")} e ${listaNomes[listaNomes.length - 1]}`;
        }

        function obterComidaFavorita(personagem) {
            if (!personagem) return "";
            return personagem.comidaFavorita || personagem.comida_favorita || personagem.comida || "";
        }

        function rolarParaOFinal() {
            const feed = document.getElementById("chatFeed");
            feed.scrollTop = feed.scrollHeight;
        }

        async function adicionarMensagemUsuario(texto) {
            const feed = document.getElementById("chatFeed");
            let idMsg = "msg-user-" + Date.now();

            feed.innerHTML += `
                <div class="msg-row user">
                    <div class="balloon balloon-user" id="${idMsg}"></div>
                </div>`;

            const balão = document.getElementById(idMsg);
            let i = 0;
            let conteudoAtual = "";

            while (i < texto.length) {
                let char = texto[i];
                conteudoAtual += char;
                balão.innerText = conteudoAtual;
                rolarParaOFinal();
                if (char !== ' ' && char !== '\n') {
                    tocarSomLetra("USERfala", 300);
                }
                await aguardar(30);
                i++;
            }
            balão.innerText = texto;
            rolarParaOFinal();
        }

        async function mostrarPensamento(passos) {
            const feed = document.getElementById("chatFeed");
            let idPensamento = "thought-" + Date.now();
            
            feed.innerHTML += `
                <div class="msg-row ia" id="${idPensamento}">
                    <div class="balloon balloon-thought">
                        <b>💭 Pensamento da IA:</b><br>
                        <span id="${idPensamento}-text"></span>
                    </div>
                </div>`;
            
            const spanText = document.getElementById(`${idPensamento}-text`);
            for (let p of passos) {
                spanText.innerHTML += `• ${p}<br>`;
                rolarParaOFinal();
                await aguardar(100);
            }
        }

        async function responderIA(textoHTML) {
            const feed = document.getElementById("chatFeed");
            let idMsg = "msg-ia-" + Date.now();

            feed.innerHTML += `
                <div class="msg-row ia">
                    <div class="balloon balloon-ia" id="${idMsg}"></div>
                </div>`;

            const balão = document.getElementById(idMsg);
            let i = 0;
            let emTag = false;
            let conteudoAtual = "";

            while (i < textoHTML.length) {
                let char = textoHTML[i];
                if (char === '<') emTag = true;
                conteudoAtual += char;
                if (char === '>') {
                    emTag = false;
                    i++;
                    continue;
                }

                if (!emTag) {
                    balão.innerHTML = conteudoAtual;
                    rolarParaOFinal();
                    if (char !== ' ' && char !== '\n') {
                        tocarSomLetra("IAfala", 650);
                    }
                    await aguardar(25);
                }
                i++;
            }
            balão.innerHTML = textoHTML;
            rolarParaOFinal();
        }

        function textoContemTermo(textoAlvo, termo) {
            let t = removerAcentos(textoAlvo);
            let b = removerAcentos(termo);
            if (!t || !b) return false;
            let regex = new RegExp(`(?:^|\\s)${escapeRegExp(b)}(?:$|\\s)`, 'i');
            return regex.test(t);
        }

        function extrairPersonagens(texto, lista) {
            let t = removerAcentos(texto);
            let achados = [];
            for (let p of lista) {
                let nomeL = removerAcentos(p.nome);
                if (textoContemTermo(t, nomeL)) { 
                    if (!achados.includes(p)) achados.push(p); 
                    continue; 
                }
                if (p.apelidos) {
                    let apList = Array.isArray(p.apelidos) ? p.apelidos : [p.apelidos];
                    for (let ap of apList) {
                        if (textoContemTermo(t, removerAcentos(ap))) { 
                            if (!achados.includes(p)) achados.push(p); 
                            break; 
                        }
                    }
                }
            }
            return achados;
        }

        function formatarValor(val) {
            if (Array.isArray(val)) return formatarListaNatural(val);
            return val || "";
        }

        function listaContemItem(listaAlvo, itemBuscado) {
            if (!listaAlvo) return false;
            let itemNorm = removerAcentos(itemBuscado);
            let arr = Array.isArray(listaAlvo) ? listaAlvo : [listaAlvo];
            return arr.some(elem => removerAcentos(elem).includes(itemNorm) || itemNorm.includes(removerAcentos(elem)));
        }

        function buscarAcontecimentosGerais(nomePersonagem, palavrasChave) {
            if (typeof HISTORIAS === 'undefined' || !HISTORIAS || palavrasChave.length === 0) return [];

            let pNomeLimpo = nomePersonagem ? removerAcentos(nomePersonagem) : "";
            let historiasEncontradas = [];

            for (let codigo in HISTORIAS) {
                let textoHistoria = HISTORIAS[codigo];
                let histLimpa = removerAcentos(textoHistoria);

                if (!pNomeLimpo || histLimpa.includes(pNomeLimpo)) {
                    let todasEcontradas = true;
                    for (let pChave of palavrasChave) {
                        let termoLimpo = removerAcentos(pChave);
                        let radicalTermo = extrairRadical(termoLimpo);

                        let achouAcao = histLimpa.includes(termoLimpo) || histLimpa.includes(radicalTermo);

                        if (!achouAcao) {
                            todasEcontradas = false;
                            break;
                        }
                    }
                    if (todasEcontradas) {
                        historiasEncontradas.push({ titulo: codigo, historia: textoHistoria });
                    }
                }
            }
            return historiasEncontradas;
        }

        async function processarPergunta() {
            const inputElement = document.getElementById("pergunta");
            const btnElement = document.getElementById("btnEnviar");
            const input = inputElement.value;
            const lista = obterBanco();

            if (!input.trim()) return;

            inputElement.value = "";
            inputElement.disabled = true;
            btnElement.disabled = true;

            await adicionarMensagemUsuario(input);

            let tNorm = removerAcentos(input);
            let passos = [`Analisando pergunta: "${input}"`];

            if (tNorm.includes("seu personagem favorito") || tNorm.includes("seu favorito")) {
                passos.push("Pergunta sobre o personagem favorito da IA.");
                await mostrarPensamento(passos);
                let respFav = sortearResposta([
                    "Não sei qual é o seu favorito, mas o meu com certeza é o <b>Beatbox</b>!",
                    "Acho difícil escolher só um, mas gosto muito do <b>Beatbox</b>!",
                    "Meu palpite principal é o <b>Beatbox</b>!"
                ]);
                await responderIA(respFav);
                finalizarPergunta();
                return;
            }

            // TRATAMENTO DE RESPOSTA NATURAL PARA "QUEM"
            let ehPerguntaQuem = /\bquem\b/i.test(tNorm);
            if (ehPerguntaQuem) {
                passos.push(`Estrutura "QUEM" detectada.`);
                
                let termosBusca = tNorm.split(/\s+/)
                    .map(w => w.replace(/[^\w-]/g, ""))
                    .filter(w => w.length > 1 && !["quem", "e", "eh", "sao", "um", "uma", "o", "a", "os", "as", "dos", "das", "do", "da", "no", "na", "nos", "nas", "em", "de", "gosta", "mora", "vive"].includes(w));

                let termoAlvo = termosBusca.join(" ");
                let encontrados = [];

                if (termoAlvo) {
                    for (let p of lista) {
                        let func = removerAcentos(formatarValor(p.funcao));
                        let esp = removerAcentos(formatarValor(p.especie));
                        let morada = removerAcentos(formatarValor(p.moradia));
                        let com = removerAcentos(formatarValor(obterComidaFavorita(p)));
                        
                        if (func.includes(termoAlvo) || esp.includes(termoAlvo) || morada.includes(termoAlvo) || com.includes(termoAlvo)) {
                            encontrados.push(p.nome);
                        }
                    }

                    if (encontrados.length === 0 && typeof HISTORIAS !== 'undefined') {
                        for (let p of lista) {
                            let resHist = buscarAcontecimentosGerais(p.nome, termosBusca);
                            if (resHist.length > 0) {
                                encontrados.push(p.nome);
                            }
                        }
                    }
                }

                await mostrarPensamento(passos);

                if (encontrados.length > 0) {
                    let listaFormatada = formatarListaNatural(encontrados);
                    let resp = sortearResposta([
                        `Quem tem relação com <b>${termoAlvo}</b> é: <b>${listaFormatada}</b>.`,
                        `Quem está envolvido com <b>${termoAlvo}</b>: <b>${listaFormatada}</b>.`,
                        `É o caso de <b>${listaFormatada}</b>!`
                    ]);
                    await responderIA(resp);
                } else {
                    let resp = sortearResposta([
                        `Não encontrei nenhum personagem associado a <b>${termoAlvo || "isso"}</b>.`,
                        `Ninguém parece ter relação com <b>${termoAlvo || "isso"}</b>.`
                    ]);
                    await responderIA(resp);
                }
                finalizarPergunta();
                return;
            }

            let personagensEncontrados = extrairPersonagens(input, lista);
            
            // Suporte a memória de contexto (pronomes dele/ela)
            if (personagensEncontrados.length === 0 && ultimoPersonagemCitado && (tNorm.includes("dele") || tNorm.includes("dela") || tNorm.includes("ele") || tNorm.includes("ela"))) {
                personagensEncontrados.push(ultimoPersonagemCitado);
                passos.push(`Usando contexto da pergunta anterior: <b>${ultimoPersonagemCitado.nome}</b>`);
            }

            let pAlvo = personagensEncontrados.length > 0 ? personagensEncontrados[0] : null;

            if (pAlvo) {
                ultimoPersonagemCitado = pAlvo;
                passos.push(`Personagem principal identificado: <b>${pAlvo.nome}</b>`);
            }

            // PERGUNTAS SOBRE TÍTULOS DE HISTÓRIA
            let pedeTituloHistoria = /\b(qual|quais)\b.*\b(historia|historias|hq|hqs|quadrinho|quadrinhos|episodio|ep)\b/i.test(tNorm);
            if (pedeTituloHistoria) {
                passos.push(`Estrutura "QUAL É A HISTÓRIA/HQ" detectada.`);
                let palavrasChave = tNorm.split(/\s+/)
                    .map(w => w.replace(/[^\w-]/g, ""))
                    .filter(w => w.length > 1 && !PALAVRAS_IGNORADAS.includes(w) && (!pAlvo || !removerAcentos(pAlvo.nome).includes(w)));

                passos.push(`Pesquisando título com os termos: ${palavrasChave.join(", ")}`);
                let resultados = buscarAcontecimentosGerais(pAlvo ? pAlvo.nome : null, palavrasChave);

                await mostrarPensamento(passos);

                if (resultados.length > 0) {
                    let titulosFormatados = resultados.map(r => `<b>${r.titulo}</b>`).join("<br>• ");
                    await responderIA(`Isso acontece nas histórias:<br>• ${titulosFormatados}`);
                } else {
                    await responderIA(`Não encontrei nenhuma história com esse acontecimento.`);
                }
                finalizarPergunta();
                return;
            }

            if (pAlvo) {
                let pronomeDeleDela = pAlvo.genero === "F" ? "dela" : "dele";

                // PERGUNTA COMPARATIVA DE MÚLTIPLOS PERSONAGENS
                if (personagensEncontrados.length > 1) {
                    let p2 = personagensEncontrados[1];
                    passos.push(`Comparando <b>${pAlvo.nome}</b> e <b>${p2.nome}</b>...`);

                    if (tNorm.includes("mesmo lugar") || tNorm.includes("moram juntos") || tNorm.includes("mesma moradia")) {
                        await mostrarPensamento(passos);
                        let m1 = formatarValor(pAlvo.moradia);
                        let m2 = formatarValor(p2.moradia);
                        if (removerAcentos(m1) === removerAcentos(m2) && m1 !== "") {
                            await responderIA(`Sim! Ambos moram em <b>${m1}</b>.`);
                        } else {
                            await responderIA(`Não, eles moram em lugares diferentes: ${pAlvo.nome} mora em <b>${m1 || "um local desconhecido"}</b> e ${p2.nome} em <b>${m2 || "outro lugar"}</b>.`);
                        }
                        finalizarPergunta();
                        return;
                    }
                }

                // IDADE
                if (tNorm.includes("idade") || tNorm.includes("quantos anos")) {
                    passos.push(`Consultando 'idade' de ${pAlvo.nome}...`);
                    await mostrarPensamento(passos);
                    let resp = sortearResposta([
                        `<b>${pAlvo.nome}</b> tem <b>${pAlvo.idade} anos</b>.`,
                        `A idade de <b>${pAlvo.nome}</b> é <b>${pAlvo.idade} anos</b>.`
                    ]);
                    await responderIA(resp);
                    finalizarPergunta();
                    return;
                }

                // COMIDA FAVORITA
                if (tNorm.includes("comida") || tNorm.includes("prato") || tNorm.includes("alimento") || tNorm.includes("gosta de comer") || tNorm.includes("comer")) {
                    passos.push(`Consultando comida favorita de ${pAlvo.nome}...`);
                    let comida = formatarValor(obterComidaFavorita(pAlvo));
                    await mostrarPensamento(passos);
                    if (comida) {
                        let resp = sortearResposta([
                            `A comida favorita de <b>${pAlvo.nome}</b> é <b>${comida}</b>.`,
                            `<b>${pAlvo.nome}</b> ama comer <b>${comida}</b>!`
                        ]);
                        await responderIA(resp);
                    } else {
                        await responderIA(`Não há menção sobre a comida favorita de <b>${pAlvo.nome}</b>.`);
                    }
                    finalizarPergunta();
                    return;
                }

                // MORADIA
                if (tNorm.includes("mora") || tNorm.includes("moradia") || tNorm.includes("vive") || tNorm.includes("reside") || tNorm.includes("endereco")) {
                    passos.push(`Consultando 'moradia' de ${pAlvo.nome}...`);
                    let morada = formatarValor(pAlvo.moradia);
                    await mostrarPensamento(passos);
                    await responderIA(`<b>${pAlvo.nome}</b> mora em <b>${morada}</b>.`);
                    finalizarPergunta();
                    return;
                }

                // FUNÇÃO / PAPEL
                if (tNorm.includes("funcao") || tNorm.includes("papel") || tNorm.includes("trabalho") || tNorm.includes("profissao")) {
                    passos.push(`Consultando 'funcao' de ${pAlvo.nome}...`);
                    let func = formatarValor(pAlvo.funcao);
                    await mostrarPensamento(passos);
                    await responderIA(`A função de <b>${pAlvo.nome}</b> é <b>${func}</b>.`);
                    finalizarPergunta();
                    return;
                }

                // RELAÇÕES (quemOdeia / quemAma)
                let ehPerguntaOdeia = tNorm.includes("odeia") || tNorm.includes("detesta") || tNorm.includes("nao gosta") || tNorm.includes("inimigo");
                let ehPerguntaGosta = tNorm.includes("gosta") || tNorm.includes("ama") || tNorm.includes("amigo");

                if (ehPerguntaOdeia || ehPerguntaGosta) {
                    let pOutro = personagensEncontrados.length > 1 ? personagensEncontrados[1] : null;
                    let alvoBusca = "";
                    if (pOutro) {
                        alvoBusca = pOutro.nome;
                    } else {
                        let palavrasLivres = tNorm.split(/\s+/).filter(w => !PALAVRAS_IGNORADAS.includes(w) && !removerAcentos(pAlvo.nome).includes(w) && !["odeia", "detesta", "gosta", "ama", "amigo", "inimigo"].includes(w));
                        alvoBusca = palavrasLivres.join(" ");
                    }

                    if (alvoBusca) {
                        passos.push(`Verificando sentimentos de ${pAlvo.nome} sobre "${alvoBusca}"...`);
                        
                        let odeiaItem = listaContemItem(pAlvo.quemOdeia, alvoBusca);
                        let amaItem = listaContemItem(pAlvo.quemAma, alvoBusca);

                        await mostrarPensamento(passos);

                        if (ehPerguntaOdeia) {
                            if (odeiaItem) {
                                await responderIA(`Sim, <b>${pAlvo.nome}</b> odeia <b>${alvoBusca}</b>!`);
                            } else if (amaItem) {
                                await responderIA(`Na verdade não, <b>${pAlvo.nome}</b> gosta de <b>${alvoBusca}</b>!`);
                            } else {
                                let respNao = sortearResposta([
                                    `<b>${pAlvo.nome}</b> não odeia <b>${alvoBusca}</b>.`,
                                    `Que eu saiba, <b>${pAlvo.nome}</b> não tem nada contra <b>${alvoBusca}</b>.`
                                ]);
                                await responderIA(respNao);
                            }
                            finalizarPergunta();
                            return;
                        }

                        if (ehPerguntaGosta) {
                            if (amaItem) {
                                await responderIA(`Sim, <b>${pAlvo.nome}</b> gosta de <b>${alvoBusca}</b>!`);
                            } else if (odeiaItem) {
                                await responderIA(`Na verdade não, <b>${pAlvo.nome}</b> odeia <b>${alvoBusca}</b>!`);
                            } else {
                                let respNao = sortearResposta([
                                    `<b>${pAlvo.nome}</b> não gosta de <b>${alvoBusca}</b>.`,
                                    `Não acho que <b>${pAlvo.nome}</b> goste de <b>${alvoBusca}</b>.`
                                ]);
                                await responderIA(respNao);
                            }
                            finalizarPergunta();
                            return;
                        }
                    }
                }

                // PERGUNTA DE ATRIBUTO/FUNÇÃO ("O Gabriel é o protagonista?")
                let ehPerguntaAtributo = /\b(e|eh|era|seria)\b/i.test(tNorm);
                if (ehPerguntaAtributo) {
                    passos.push(`Detectada pergunta sobre atributo/função ("é...").`);
                    
                    let termos = tNorm.split(/\s+/).filter(w => 
                        !PALAVRAS_IGNORADAS.includes(w) && 
                        !removerAcentos(pAlvo.nome).includes(w) && 
                        !["e", "eh", "era", "seria"].includes(w)
                    );
                    
                    let termoAlvo = termos.join(" ");

                    if (termoAlvo) {
                        let funcaoStr = removerAcentos(formatarValor(pAlvo.funcao));
                        let especieStr = removerAcentos(formatarValor(pAlvo.especie));

                        await mostrarPensamento(passos);

                        if (funcaoStr.includes(termoAlvo) || especieStr.includes(termoAlvo)) {
                            await responderIA(`Sim! <b>${pAlvo.nome}</b> é <b>${termoAlvo}</b>.`);
                        } else {
                            await responderIA(`Não, <b>${pAlvo.nome}</b> não é <b>${termoAlvo}</b>. A função ou espécie ${pronomeDeleDela} é <b>${formatarValor(pAlvo.funcao) || formatarValor(pAlvo.especie)}</b>.`);
                        }
                        finalizarPergunta();
                        return;
                    }
                }

                // PESQUISA DE AÇÕES / VERBOS NAS HISTÓRIAS
                let palavrasChave = tNorm.split(/\s+/)
                    .map(w => w.replace(/[^\w-]/g, ""))
                    .filter(w => w.length > 1 && !PALAVRAS_IGNORADAS.includes(w) && !removerAcentos(pAlvo.nome).includes(w));

                if (palavrasChave.length > 0) {
                    passos.push(`Pesquisando ações com os termos: ${palavrasChave.join(", ")}`);
                    let resultados = buscarAcontecimentosGerais(pAlvo.nome, palavrasChave);

                    await mostrarPensamento(passos);

                    if (resultados.length > 0) {
                        await responderIA(`Sim, <b>${pAlvo.nome}</b> já fez isso nas histórias!`);
                    } else {
                        let acaoTexto = palavrasChave.join(" ");
                        let respNao = sortearResposta([
                            `<b>${pAlvo.nome}</b> nunca <b>${acaoTexto}</b>.`,
                            `Nas histórias, <b>${pAlvo.nome}</b> nunca <b>${acaoTexto}</b>.`,
                            `Não há nenhum relato de que <b>${pAlvo.nome}</b> tenha feito isso.`
                        ]);
                        await responderIA(respNao);
                    }
                    finalizarPergunta();
                    return;
                }

                // FALLBACK COM FICHA COMPLETA
                await mostrarPensamento(passos);
                let comidaFav = formatarValor(obterComidaFavorita(pAlvo)) || "Não informada";
                await responderIA(`Ficha de <b>${pAlvo.nome}</b>:<br>` +
                    `• Idade: ${pAlvo.idade} anos | Espécie: ${formatarValor(pAlvo.especie)}<br>` +
                    `• Função: ${formatarValor(pAlvo.funcao)} | Moradia: ${formatarValor(pAlvo.moradia)}<br>` +
                    `• Comida Favorita: ${comidaFav}`);
                finalizarPergunta();
                return;
            }

            passos.push("Nenhum personagem foi reconhecido no texto.");
            await mostrarPensamento(passos);
            let respNaoEntendeu = sortearResposta([
                "Não entendi muito bem. Tente citar o nome de um personagem ou perguntar algo como 'Quem é...'",
                "Hmm, não consegui identificar sobre quem você está perguntando. Pode refazer a pergunta?",
                "Não encontrei informações sobre isso. Tente perguntar sobre algum personagem específico!"
            ]);
            await responderIA(respNaoEntendeu);
            finalizarPergunta();
        }

        function finalizarPergunta() {
            const inputElement = document.getElementById("pergunta");
            const btnElement = document.getElementById("btnEnviar");
            inputElement.disabled = false;
            btnElement.disabled = false;
            inputElement.focus();
        }
    </script>
</body>
</html>
